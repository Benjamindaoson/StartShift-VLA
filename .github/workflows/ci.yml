name: CI

on:
  push:
    branches: [main, codex-full-implementation]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: ruff check startshift tests scripts/run_full_matrix.py
      - name: Compile
        run: python -m compileall -q startshift tests scripts
      - name: Tests
        run: pytest
