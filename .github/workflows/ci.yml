name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: ruff check startshift tests scripts/run_full_matrix.py scripts/run_eval_matrix.py scripts/verify_environment.py
      - name: Shell syntax
        run: bash -n scripts/*.sh
      - name: Compile
        run: python -m compileall -q startshift tests scripts
      - name: Tests
        run: pytest
