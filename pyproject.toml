[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "startshift-vla"
version = "0.1.0"
description = "Diagnosing and mitigating hidden reset-state dependence in vision-language-action policies."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Benjamin Daoson"}]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "PyYAML>=6.0",
  "matplotlib>=3.9",
  "scipy>=1.13",
  "tqdm>=4.66",
]

[project.optional-dependencies]
robotics = [
  "torch>=2.6",
  "huggingface_hub>=0.36",
]
dev = [
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.9",
]

[project.scripts]
startshift = "startshift.cli:main"

[tool.setuptools.packages.find]
include = ["startshift*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
